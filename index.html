      --preto: #090909;

    html { scroll-behavior: smooth; }

    /* HEADER */
    header {
      position: fixed; top: 0; width: 100%; z-index: 1000;
      background: rgba(9,9,9,0.7); backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(212,175,55,0.2);
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 5%;
    }
    header .logo { font-family: 'Cinzel', serif; font-size: 1.8rem; color: var(--dourado); font-weight: 700; }
    nav a { color: var(--branco); text-decoration: none; margin-left: 30px; font-weight: 400; transition: 0.3s; }
    nav a:hover { color: var(--dourado); }

    /* HERO */
    .hero {
      height: 100vh; display: flex; align-items: center; padding: 0 5%;
      background: radial-gradient(circle at 70% 30%, rgba(212,175,55,0.15) 0%, transparent 50%), var(--preto);
      position: relative; overflow: hidden;
    }

      content: ''; position: absolute; width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(212,175,55,0.1) 0%, transparent 60%);
      animation: smoke 20s infinite linear;
    }
    @keyframes smoke { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
